<vd-page-header titulo="catalogo.titulo" subtitulo="catalogo.subtitulo">
  <div slot="acciones" class="vd-catalogo__acciones">
    <mat-form-field class="vd-catalogo__busqueda">
      <input
        matInput
        type="search"
        [placeholder]="'catalogo.buscar_placeholder' | translate"
        [(ngModel)]="consulta"
        (keyup.enter)="buscar()"
      />
    </mat-form-field>
    <button matButton="outlined" type="button" [disabled]="cargando()" (click)="buscar()">
      <mat-icon aria-hidden="true">search</mat-icon>
      {{ 'comun.buscar' | translate }}
    </button>
    <button
      matButton="filled"
      type="button"
      *vdHasPermission="'producto:editar'"
      [disabled]="cargando()"
      (click)="crear()"
    >
      <mat-icon aria-hidden="true">add</mat-icon>
      {{ 'catalogo.nuevo.accion' | translate }}
    </button>
  </div>
</vd-page-header>

@if (fallo()) {
  <!--
    Salida del callejón sin salida: cuando el listado falla, el aviso del
    interceptor se desvanece y sin esto la pantalla queda vacía y muda. El botón
    de reintentar es lo que convierte "se rompió" en "vuelve a intentarlo".
  -->
  <div class="vd-catalogo__fallo" role="alert">
    <span>{{ 'catalogo.fallo' | translate }}</span>
    <button matButton type="button" (click)="recargar()">
      {{ 'comun.reintentar' | translate }}
    </button>
  </div>
}

<vd-data-table
  [columnas]="columnas()"
  [filas]="filas()"
  [total]="total()"
  [cargando]="cargando()"
  [indicePagina]="indicePagina()"
  [tamanoPagina]="tamanoPagina()"
  iconoVacio="inventory_2"
  tituloVacio="catalogo.vacio.titulo"
  descripcionVacio="catalogo.vacio.descripcion"
  (paginaCambia)="alPaginar($event)"
/>

<!-- El precio viaja en centavos: al usuario se le muestra en pesos. -->
<ng-template #celdaPrecio let-fila>{{ formatear(fila.precio_venta) }}</ng-template>

<!-- El stock es un string de 3 decimales (granel); la unidad se traduce. -->
<ng-template #celdaStock let-fila>
  {{ fila.stock_actual }} {{ 'catalogo.unidad.' + fila.unidad_medida | translate }}
</ng-template>

<ng-template #celdaAcciones let-fila>
  <button
    matIconButton
    type="button"
    *vdHasPermission="'producto:editar'"
    [matMenuTriggerFor]="menuFila"
    [attr.aria-label]="'catalogo.columna.acciones' | translate"
  >
    <mat-icon aria-hidden="true">more_vert</mat-icon>
  </button>
  <mat-menu #menuFila="matMenu">
    <button mat-menu-item type="button" *vdHasPermission="'producto:editar'" (click)="editar(fila)">
      <mat-icon aria-hidden="true">edit</mat-icon>
      <span>{{ 'catalogo.editar.accion' | translate }}</span>
    </button>
    <button
      mat-menu-item
      type="button"
      *vdHasPermission="'producto:editar'"
      (click)="eliminar(fila)"
    >
      <mat-icon aria-hidden="true">delete</mat-icon>
      <span>{{ 'catalogo.eliminar' | translate }}</span>
    </button>
  </mat-menu>
</ng-template>
