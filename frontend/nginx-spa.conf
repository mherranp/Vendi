# Servidor estático de una SPA de Vendi (vendi-portal · vendi-tenant · vendi-admin).
#
# Lo consume `frontend/Dockerfile`; la misma configuración vale para las tres
# apps porque todas son el mismo artefacto: un `index.html` más ficheros con
# hash en el nombre.
#
# Cosechado de /Users/maoherran/BaseSaaS/frontend/nginx-spa.conf con tres
# correcciones que allí faltaban y que en Vendi sí importan:
#
#   1. `index.html` con `no-store`. Sin esto, el navegador (o cualquier caché
#      intermedia) se queda con un index viejo que referencia bundles con hash
#      que ya no existen: la app arranca en blanco y solo se arregla con
#      Ctrl+Shift+R. Es el modo de fallo clásico de una SPA con despliegue
#      continuo, y no se nota hasta el segundo despliegue.
#   2. Los catálogos de i18n (`/i18n/*.json`) NO se cachean de forma agresiva:
#      no llevan hash en el nombre ni sello de versión (el cargador los pide
#      sin query), así que su ÚNICA invalidación es este `max-age=300,
#      must-revalidate`: a lo sumo 5 minutos de desfase tras un despliegue.
#      Un `immutable` de 7 días haría que una corrección de texto tardase una
#      semana en verse.
#   3. `ngsw-worker.js` y `ngsw.json` (service worker de vendi-app en web) con
#      `no-store`: un service worker cacheado es un service worker que nunca se
#      actualiza, y se lleva por delante todo el resto del versionado.
#
# TLS, HSTS, CORS y cabeceras de seguridad las pone Traefik en el borde
# (middleware `secure-headers`): aquí NO se duplican. Duplicar
# `X-Frame-Options` o `Content-Type-Options` produce cabeceras repetidas que
# algunos navegadores tratan como inválidas.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sondas del contenedor y de Traefik. Responde sin tocar el disco.
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # El index es el único fichero sin hash del que depende todo lo demás.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # Service worker: nunca se cachea. Ver nota 3 de la cabecera.
    location ~* ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js)$ {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # Catálogos de traducción: sin hash ni versión; caducan a los 5 minutos.
    location ^~ /i18n/ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    # Estáticos con hash en el nombre: inmutables de verdad.
    location ~* \.(js|css|svg|woff2?|ttf|eot|png|jpg|jpeg|gif|webp|ico|map)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Encaminamiento del router de Angular: cualquier ruta desconocida devuelve
    # el index y la resuelve la SPA en el cliente.
    location / {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
