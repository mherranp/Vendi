apply plugin: 'com.android.application'

android {
    namespace = "co.vendi.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "co.vendi.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // -------------------------------------------------------------------
    // Firma del AAB de Fase 0
    // -------------------------------------------------------------------
    // Fase 0 entrega un AAB DE PRUEBA: no se publica en Play, se descarga del
    // workflow y se instala en un emulador para comprobar que arranca. La
    // firma de publicación (App Signing de Google Play, con la clave de subida
    // en secretos del repositorio) llega con la Fase 1.
    //
    // Aun así el artefacto se FIRMA, y no se deja sin firmar como propuso el
    // borrador del plan, por una razón práctica: un AAB sin firmar no se puede
    // instalar sin que quien lo pruebe invente una clave por su cuenta, y
    // «descargable» sin «instalable» no demuestra el criterio 4. Con la clave
    // desechable de abajo, `bundletool build-apks` + `install` funciona tal
    // cual, y el APK resultante es reproducible entre ejecuciones.
    //
    // La clave sale de `keystore.properties` (ignorado por git, ver el
    // .gitignore de la raíz). Si el archivo no existe —el caso de quien solo
    // compila en depuración— la configuración de firma sencillamente no se
    // declara y `bundleRelease` produce un AAB sin firmar, sin romper nada.
    // Nunca hay claves en el repositorio.
    def propiedadesDeFirma = new Properties()
    def archivoDeFirma = rootProject.file('keystore.properties')
    if (archivoDeFirma.exists()) {
        archivoDeFirma.withInputStream { propiedadesDeFirma.load(it) }
    }

    signingConfigs {
        if (archivoDeFirma.exists()) {
            fase0 {
                storeFile rootProject.file(propiedadesDeFirma['storeFile'])
                storePassword propiedadesDeFirma['storePassword']
                keyAlias propiedadesDeFirma['keyAlias']
                keyPassword propiedadesDeFirma['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (archivoDeFirma.exists()) {
                signingConfig signingConfigs.fase0
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
