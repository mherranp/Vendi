[project]
name = "vendi-worker"
version = "0.1.0"
description = "Worker de Vendi: dispatcher del outbox y planificador de trabajos"
requires-python = ">=3.12"
dependencies = [
    "vendi-core[all]",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv.sources]
vendi-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
