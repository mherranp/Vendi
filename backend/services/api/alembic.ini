# Configuración de Alembic para la API de Vendi.
#
# Una sola pasada, un solo schema. En BaseSaaS el env.py recorría los schemas de
# los inquilinos aplicando la misma migración N veces; aquí no hay nada que
# recorrer: hay un schema regional y la separación entre negocios la da RLS.
#
# La URL NO va aquí: la lee env.py de la variable de entorno DATABASE_URL, que
# `scripts/migrate.sh` fija al DSN de `vendi_platform`. Escribirla en el .ini
# significaría o meter una contraseña en el repositorio o dejar un valor por
# defecto que en producción apunta al sitio equivocado.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Prefijo de fecha en el nombre del archivo: hace que `ls versions/` salga en
# orden cronológico, que es como se lee la historia de un esquema.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
