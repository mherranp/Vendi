[project]
name = "vendi-api"
version = "0.1.0"
description = "API de Vendi: monolito modular FastAPI sobre vendi-core"
requires-python = ">=3.12"
dependencies = [
    "vendi-core[all]",
    "uvicorn[standard]>=0.30.0",
    "alembic>=1.14.0",
    "python-multipart>=0.0.24",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.uv.sources]
vendi-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
