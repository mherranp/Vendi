[project]
name = "vendi-provisioner"
version = "0.1.0"
description = "Provisioner de Vendi: el único proceso con la credencial manage-realm (cierre de D-02)"
requires-python = ">=3.12"
dependencies = [
    "vendi-core[all]",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.uv.sources]
vendi-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["provisioner"]
