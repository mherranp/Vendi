apiVersion: 1

datasources:
  - name: Prometheus
    # El uid es explícito porque los paneles del dashboard provisionado lo
    # referencian por nombre ("uid": "prometheus"). Sin fijarlo, Grafana genera
    # uno aleatorio y los paneles aparecen con "Datasource not found" — un fallo
    # silencioso heredado de la configuración de BaseSaaS.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
