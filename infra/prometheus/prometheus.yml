global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Grupos de reglas de alerta. El directorio ./prometheus/rules se monta en
# /etc/prometheus/rules desde infra/docker-compose.yml: basta añadir un YAML
# ahí y recargar.
rule_files:
  - rules/*.yml

scrape_configs:
  # El propio Prometheus — útil para la serie `up` y para comprobar que el
  # scraping funciona antes de culpar a la aplicación.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # La API expone /metrics vía prometheus-fastapi-instrumentator (se cablea en
  # la tarea 4.1). Hasta entonces este target aparece como `up == 0`, que es
  # información honesta: el endpoint todavía no existe.
  - job_name: vendi-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # El worker publicará su servidor lateral de métricas con el dispatcher real
  # (tarea 4.3). Mismo razonamiento que arriba.
  - job_name: vendi-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9090"]
