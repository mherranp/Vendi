# Capa de producción. Se activa con:
#   docker compose -f docker-compose.yml -f docker-compose.override.prod.yml up -d
#
# Los límites de recursos son conservadores y están pensados para la VM de la
# región CO (4 vCPU / 8 GB) con todo el stack encima. Súbelos en una máquina
# mayor; bájalos con datos de Grafana delante, no a ojo: un OOM del stack se
# manifiesta como peticiones de tenants que fallan en silencio.
#
# Antes de usar este archivo, leer:
#   - infra/keycloak/README.md (endurecimiento de Keycloak, ROPC, drift)
#   - la sección de ACME de infra/traefik/traefik.yml
#
# -----------------------------------------------------------------------------
# IMÁGENES: en producción NO se construye, se despliega lo publicado
# -----------------------------------------------------------------------------
# Los siete servicios propios de Vendi (`api`, `worker`, `provisioner`,
# `keycloak`, `portal`, `tenant`, `admin`) llevan aquí un `image:` que apunta a
# una etiqueta CONCRETA publicada por .github/workflows/release-images.yml.
#
# No es una preferencia de estilo: `deploy.yml` sincroniza a la VM solo el
# directorio `infra/`. En el servidor NO existen `../backend` ni `../frontend`,
# que son los contextos de construcción del compose base. Sin estas líneas,
# `docker compose pull` no se trae nada («No image to be pulled») y el `up`
# siguiente intenta construir desde rutas inexistentes y muere con
# «unable to prepare context: path "/opt/vendi/backend" not found».
#
# Las variables son OBLIGATORIAS (`:?`) a propósito. Con un valor por defecto
# tipo `vendi-api:local`, un despliegue con el .env incompleto fallaba con
# «pull access denied for vendi-api, repository does not exist», que suena a
# problema de credenciales del registro y no a lo que realmente pasa: que nadie
# dijo qué versión desplegar. Ahora el compose se niega a arrancar nombrando la
# variable que falta.
#
# En el .env de la VM (lo pone el operador; nunca viaja desde GitHub):
#
#   VENDI_IMAGE_REGISTRY=ghcr.io/<org>
#   VENDI_IMAGE_TAG=v0.1.0          # o sha-<corto>, la que publicó el workflow
#
# Para probar el camino en local sin registro, se construyen a mano
# (`docker compose ... build`) y se etiquetan con lo que digan esas variables.
# -----------------------------------------------------------------------------

services:
  traefik:
    # Producción con certificados de Let's Encrypt. En el .env del servidor:
    #
    #   ACME_ENABLED=true
    #   ACME_STAGING=true          # ← empieza SIEMPRE aquí
    #   ACME_EMAIL=ops@tu-dominio
    #
    # Con eso el entrypoint mete los flags del resolver y todos los routers
    # pasan a `certResolver: letsencrypt` (el archivo de certificados locales
    # ni se escribe). Cuando el primer certificado de staging se emita bien,
    # ACME_STAGING=false, se borra el acme.json del volumen (guarda la cuenta y
    # los certificados de la CA de pruebas) y se reinicia:
    #
    #   docker compose ... run --rm -T traefik sh -c 'rm -f /letsencrypt/acme.json'
    #   docker compose ... up -d --force-recreate traefik
    #
    # El camino se verifica sin exponer nada a internet con
    # scripts/spikes/acme-pebble-spike.sh (CA ACME local).
    restart: unless-stopped
    ports:
      # En producción el borde SÍ escucha en todas las interfaces: es el punto
      # de entrada del despliegue. En desarrollo el default es loopback.
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  postgres:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  postgres-backup:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  redis:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  rabbitmq:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  minio:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  keycloak:
    # `start-dev` NO es aceptable en producción: relaja el hostname y usa
    # almacenamiento de desarrollo.
    #
    # Desde la Etapa 5 se arranca con `--optimized` sobre la imagen propia de
    # Vendi (infra/keycloak/Dockerfile), que ya trae ejecutado `kc.sh build`.
    # Antes se usaba `start` a secas y cada arranque hacía un build implícito de
    # decenas de segundos, alargando la indisponibilidad de cada despliegue y de
    # cada reinicio no planificado — era la deuda D-04.
    #
    # `--optimized` sobre la imagen oficial NO arranca: el servidor exige que el
    # build se haya hecho antes. De ahí que las dos líneas —imagen y comando—
    # tengan que cambiar juntas.
    #
    image: ${VENDI_IMAGE_REGISTRY:?VENDI_IMAGE_REGISTRY es obligatorio en producción (p. ej. ghcr.io/<org>); lo publica release-images.yml}/vendi-keycloak:${VENDI_IMAGE_TAG:?VENDI_IMAGE_TAG es obligatorio en producción (p. ej. v0.1.0 o sha-1a2b3c4)}
    build:
      context: ./keycloak
    command: start --optimized --import-realm
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  api:
    image: ${VENDI_IMAGE_REGISTRY:?VENDI_IMAGE_REGISTRY es obligatorio en producción}/vendi-api:${VENDI_IMAGE_TAG:?VENDI_IMAGE_TAG es obligatorio en producción}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  provisioner:
    image: ${VENDI_IMAGE_REGISTRY:?VENDI_IMAGE_REGISTRY es obligatorio en producción}/vendi-provisioner:${VENDI_IMAGE_TAG:?VENDI_IMAGE_TAG es obligatorio en producción}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  worker:
    image: ${VENDI_IMAGE_REGISTRY:?VENDI_IMAGE_REGISTRY es obligatorio en producción}/vendi-worker:${VENDI_IMAGE_TAG:?VENDI_IMAGE_TAG es obligatorio en producción}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Las tres SPAs. En la VM no existe `../frontend`, así que sin `image:` el
  # compose intentaba construirlas desde un contexto inexistente. El artefacto
  # ya viene horneado con el BASE_DOMAIN de producción desde release-images.yml.
  portal:
    image: ${VENDI_IMAGE_REGISTRY:?VENDI_IMAGE_REGISTRY es obligatorio en producción}/vendi-portal:${VENDI_IMAGE_TAG:?VENDI_IMAGE_TAG es obligatorio en producción}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  tenant:
    image: ${VENDI_IMAGE_REGISTRY:?VENDI_IMAGE_REGISTRY es obligatorio en producción}/vendi-tenant:${VENDI_IMAGE_TAG:?VENDI_IMAGE_TAG es obligatorio en producción}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  admin:
    image: ${VENDI_IMAGE_REGISTRY:?VENDI_IMAGE_REGISTRY es obligatorio en producción}/vendi-admin:${VENDI_IMAGE_TAG:?VENDI_IMAGE_TAG es obligatorio en producción}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  prometheus:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  grafana:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
