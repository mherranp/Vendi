# Tema de login de Vendi.
#
# Cosecha PARCIAL del tema `basesaas-theme` de BaseSaaS: se porta la capa de
# estilos (CSS + logo) y NO las plantillas FreeMarker. Motivo medido en el
# spike 1.1 (pregunta 9): con Organizations habilitadas el login pasa a ser
# identity-first, o sea DOS pantallas (login-username.ftl y luego
# login-password.ftl / la de passkey). El login.ftl de BaseSaaS está escrito
# para una sola pantalla con usuario y contraseña juntos; portarlo dejaría
# maquetada la pantalla equivocada y rota la que sí se usa.
#
# Heredando de `keycloak` se obtiene el marcado correcto de las dos pantallas
# y de la de selección de credencial ("Try Another Way"), y vendi.css les da
# la identidad visual. Cuando la marca esté cerrada (ui-kit, Etapa 3), se
# valorará portar plantillas concretas.
parent=keycloak
import=common/keycloak
locales=es
# `styles` NO se hereda ni se acumula: REEMPLAZA la lista del tema padre. Con
# `styles=css/vendi.css` a secas, la página perdía el css/login.css del tema
# `keycloak` (maquetación de la tarjeta, el fondo y la cabecera) y solo
# quedaban PatternFly crudo y nuestros colores. Medido en el HTML servido por
# 26.6.4 antes del arreglo:
#
#   <link href=".../common/keycloak/vendor/patternfly-v4/patternfly.min.css">
#   <link href=".../common/keycloak/vendor/patternfly-v3/css/patternfly.min.css">
#   <link href=".../common/keycloak/vendor/patternfly-v3/css/patternfly-additions.min.css">
#   <link href=".../common/keycloak/lib/pficon/pficon.css">
#   <link href=".../login/vendi/css/vendi.css">      ← y ningún login.css
#
# Se repite la del padre y la nuestra va DETRÁS para ganar en cascada.
styles=css/login.css css/vendi.css
meta=viewport==width=device-width,initial-scale=1
